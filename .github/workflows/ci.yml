name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  # Same tests against PostgreSQL, so the Flyway migrations also work in production (Entscheidung 20)
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: budget
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Environment variables outrank application-test.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/budget
      SPRING_DATASOURCE_USERNAME: budget
      SPRING_DATASOURCE_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The image for operations (Entscheidung 21); built only, not pushed or deployed
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t budget-tracker .

  # Plays an update on the server (spec section 7): start the target branch with test data, then update to
  # this pull request with the same database volume and check that the app starts and the data is unchanged.
  # Catches what tests on an empty database cannot, e.g. a PostgreSQL major version or a migration that fails
  # on existing rows.
  update-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: budget
      DB_PASSWORD: ci-only-password
      ADMIN_EMAIL: person-a@example.test
      ADMIN_PASSWORD: test-only-password
      ADMIN_DISPLAY_NAME: Person A
      SESSION_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base
      - uses: actions/checkout@v7
        with:
          path: pr
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Start the target branch
        run: docker compose -f base/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Create test data
        run: node pr/scripts/update-test.mjs seed snapshot.json
      - name: Update to this pull request
        run: docker compose -f pr/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Check the data
        run: node pr/scripts/update-test.mjs check snapshot.json
      - name: Logs
        if: failure()
        run: docker compose -f pr/docker-compose.yml logs

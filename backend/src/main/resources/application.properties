spring.application.name=budget

# Without an active profile the local profile "dev" applies (decision 35); "test" (Maven) and "postgres"
# (production) are not affected. Local logins live only in application-dev/-sample.properties.
spring.profiles.default=dev

# Local file database of the profile dev (ignored by git, see .gitignore), in PostgreSQL mode like production;
# sample, test and postgres set their own
spring.datasource.url=jdbc:h2:file:./data/dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# The schema comes only from the Flyway migrations in db/migration (US11); Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors as RFC 7807 ProblemDetail
spring.mvc.problemdetails.enabled=true

# H2 Konsole Webschnittstelle
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Session cookie (section 15): expires after 30 days without use
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
# Secure is off for now, so the app can be tested over plain HTTP in the home network (e.g. on a phone via the IP).
# Before the app is published it must be on again, together with HTTPS (AP 19, spec section 16).
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# First admin, created on the first start when no user exists (US15); values only from environment variables
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.display-name=${ADMIN_DISPLAY_NAME:}

# Health check for Docker (section 15): only /actuator/health, only the status
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

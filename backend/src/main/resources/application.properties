spring.application.name=budget

# Local file database (ignored by git, see .gitignore), in PostgreSQL mode like production
spring.datasource.url=jdbc:h2:file:./data/budget;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# The schema comes only from the Flyway migrations in db/migration (US11); Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors as RFC 7807 ProblemDetail
spring.mvc.problemdetails.enabled=true

# H2 Konsole Webschnittstelle
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

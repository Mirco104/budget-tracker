spring.application.name=budget

# Local file database (ignored by git, see .gitignore), in PostgreSQL mode like production
spring.datasource.url=jdbc:h2:file:./data/budget;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# The schema comes only from the Flyway migrations in db/migration (US11); Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Errors as RFC 7807 ProblemDetail
spring.mvc.problemdetails.enabled=true

# H2 Konsole Webschnittstelle
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Session cookie (section 15): expires after 30 days without use
server.servlet.session.timeout=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# First admin, created on the first start when no user exists (US15); values only from environment variables
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.display-name=${ADMIN_DISPLAY_NAME:}

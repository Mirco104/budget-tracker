# Production database (Entscheidung 20); connection and secrets only from environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.h2.console.enabled=false

# Production runs behind HTTPS (Caddy, section 15), so the session cookie is Secure (closes the open point in section 16).
# Set SESSION_COOKIE_SECURE=false only to test over plain HTTP in the home network.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# Take scheme and host from the reverse proxy, so invitation links (US15) point to the HTTPS address
server.forward-headers-strategy=native

# No API documentation in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

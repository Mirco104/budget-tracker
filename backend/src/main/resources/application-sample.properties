# Local profile "sample" (decision 35): fictional sample data for Person A to D from January 2025 to October 2026,
# created by SampleDataSeeder on the first start. Reset with scripts/reset-db.sh sample
spring.datasource.url=jdbc:h2:file:./data/sample;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH

# Fictional logins, only for local development: Admin is the system admin,
# person-a@example.test (admin) and person-b/-c/-d@example.test (users) share app.sample.password
app.admin.email=admin@example.test
app.admin.password=dev-only-password
app.admin.display-name=Admin
app.sample.password=sample-only-password
